name: Inspect photo quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-image-quality.py'
      - '.github/workflows/audit-image-quality.yml'
      - 'assets/**/*.jpg'
      - 'assets/**/*.jpeg'
      - 'assets/**/*.png'
      - 'assets/**/*.webp'
      - 'images/**/*.jpg'
      - 'images/**/*.png'
      - 'images/**/*.webp'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow for read-only inspection
        run: python3 -m pip install --quiet --target /tmp/ew-photo-qa 'Pillow>=10,<13'
      - name: Report image dimensions and comparative detail
        env:
          PYTHONPATH: /tmp/ew-photo-qa
        run: python3 scripts/audit-image-quality.py
