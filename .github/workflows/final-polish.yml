name: Apply final homepage polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-polish.yml'
      - 'scripts/final_polish.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply final polish and audit
        shell: bash
        run: python scripts/final_polish.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/tour-map.js places travel edinburgh
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Complete detail breadcrumbs and sharing metadata'
            git push
          fi
