name: Apply agreed brand header once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brand-header-rollout-once.yml'

permissions:
  contents: write

concurrency:
  group: agreed-brand-header-rollout
  cancel-in-progress: false

jobs:
  update-brand-header:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Replace only shared header name and agreed home intro/SEO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = ['places', 'edinburgh', 'scotland', 'st-andrews', 'travel']
          paths = [Path('index.html'), Path('privacy.html'), Path('404.html')]
          for root in roots:
              paths += sorted(Path(root).rglob('*.html'))
          pattern = re.compile(r'(<a class="brand"\s+href="[^"]+">\s*<span class="mark">EW</span>\s*<span>)에든버러 워킹투어(</span>\s*</a>)')
          updates = {}
          for path in paths:
              original = path.read_text(encoding='utf-8')
              content, count = pattern.subn(r'\1걸어서 에든버러\2', original)
              if count != 1:
                  raise RuntimeError(f'{path}: header brand count {count}, expected exactly one')
              updates[path] = content

          home = Path('index.html')
          new = updates[home]
          changes = {
              '<title>에든버러 워킹투어 | 걸어서 만나는 에든버러</title>': '<title>걸어서 에든버러 | 에든버러 워킹투어·스코틀랜드 여행정보</title>',
              '<meta name="description" content="에든버러의 주요 명소를 걸으며 만나는 한국어 워킹투어. 약 4시간 코스와 장소·역사·인물 이야기, 스코틀랜드 여행정보를 안내합니다.">': '<meta name="description" content="걸어서 에든버러는 에든버러 워킹투어 코스와 도시의 장소·역사·인물·문화, 스코틀랜드 여행정보를 소개합니다.">',
              '<meta name="keywords" content="에든버러 워킹투어,': '<meta name="keywords" content="걸어서 에든버러, 에든버러 워킹투어,',
              '<meta property="og:title" content="에든버러 워킹투어 | 걸어서 만나는 에든버러">': '<meta property="og:title" content="걸어서 에든버러 | 에든버러 워킹투어·스코틀랜드 여행정보">',
              '<meta property="og:description" content="에든버러 주요 명소를 걸어서 만나는 한국어 워킹투어. 약 4시간, 1인부터 단체까지.">': '<meta property="og:description" content="걸어서 에든버러는 에든버러 워킹투어 코스와 도시의 장소·역사·인물·문화, 스코틀랜드 여행정보를 소개합니다.">',
              '<meta property="og:site_name" content="에든버러 워킹투어">': '<meta property="og:site_name" content="걸어서 에든버러">',
              '"name": "에든버러 워킹투어",': '"name": "걸어서 에든버러",\n  "alternateName": "에든버러 워킹투어",',
              '<p class="lead">에든버러 주요 명소는 걸어서 볼 수 있습니다.</p>': '<p class="lead">걸어서 에든버러는 에든버러 워킹투어 코스를 중심으로 도시의 장소·역사·인물·문화와 스코틀랜드 여행정보를 소개합니다.</p>',
          }
          for before, after in changes.items():
              if new.count(before) != 1:
                  raise RuntimeError(f'Homepage expected exactly one matching fragment: {before[:85]}')
              new = new.replace(before, after)
          updates[home] = new

          if '<h1>에든버러 워킹투어</h1><p class="sub">걸어서 에든버러</p>' not in new:
              raise RuntimeError('Hero title/subtitle no longer intact')
          if '<footer><div class="wrap foot"><a href="/">에든버러 워킹투어</a></div></footer>' not in new:
              raise RuntimeError('Home footer no longer intact')
          if '<span>세인트앤드루스 워킹투어 안내</span>' not in new:
              raise RuntimeError('St Andrews link unexpectedly modified')
          saint = updates[Path('st-andrews/index.html')]
          if '<title>세인트앤드루스 워킹투어 안내 | 스코틀랜드 여행</title>' not in saint:
              raise RuntimeError('St Andrews title changed')
          for path, newtext in updates.items():
              path.write_text(newtext, encoding='utf-8')
          print(f'Applied exact site-header change to {len(updates)} HTML pages, homepage intro/meta only.')
          PY

      - name: Verify all original article structures remain valid
        run: |
          node scripts/audit-site.mjs
          node scripts/audit-publication-quality.mjs
          node scripts/audit-accessibility.mjs
          git diff --check

      - name: Commit audited brand update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          git commit -m "Apply 걸어서 에든버러 in shared headers, preserve article copy and footer"
          git push origin HEAD:main
