name: Temporary image metadata audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metadata-audit-temp.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metadata-audit-20260927
          fetch-depth: 0
      - name: Install ExifTool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libimage-exiftool-perl >/dev/null
      - name: Strip privacy metadata without recompressing images
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "1280＿1756577756454.jpg"
            "assets/1280＿1754399052815.jpg"
            "assets/1280＿1755072289623.jpg"
            "assets/ab75b4d57bc76a4b8ce8d532e05cf08119800cc3381112669064a9110390bfc7 (1).png"
            "assets/ef5aaf4cfaf9f16155eb5ee1cd41d106619e0101e5cda928c3643511b0087258.png"
            "assets/princes-street-gardens/20160602_142956.jpg"
            "assets/princes-street-gardens/20160602_143215.jpg"
            "assets/princes-street-gardens/20180626_152029.jpg"
          )
          for f in "${files[@]}"; do
            exiftool -overwrite_original               -XMP:all= -IPTC:all= -GPS:all= -MakerNotes:all=               -EXIF:Make= -EXIF:Model= -EXIF:Software=               -EXIF:DateTimeOriginal= -EXIF:CreateDate= -IFD0:ModifyDate=               -EXIF:CameraOwnerName= -EXIF:BodySerialNumber= -EXIF:LensSerialNumber=               -IFD0:Artist= -IFD0:Copyright= "$f" >/dev/null || true
          done
          python - <<'PY'
          from pathlib import Path
          import struct
          files = [
              Path("assets/ab75b4d57bc76a4b8ce8d532e05cf08119800cc3381112669064a9110390bfc7 (1).png"),
              Path("assets/ef5aaf4cfaf9f16155eb5ee1cd41d106619e0101e5cda928c3643511b0087258.png"),
          ]
          for path in files:
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              out = bytearray(data[:8])
              p = 8
              removed = 0
              while p + 12 <= len(data):
                  n = struct.unpack(">I", data[p:p+4])[0]
                  typ = data[p+4:p+8]
                  end = p + 12 + n
                  if typ == b"caBX":
                      removed += 1
                  else:
                      out += data[p:end]
                  p = end
                  if typ == b"IEND":
                      break
              path.write_bytes(out)
              print(path, "removed caBX:", removed)
          PY
      - name: Commit cleaned originals to audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             "1280＿1756577756454.jpg"             "assets/1280＿1754399052815.jpg"             "assets/1280＿1755072289623.jpg"             "assets/ab75b4d57bc76a4b8ce8d532e05cf08119800cc3381112669064a9110390bfc7 (1).png"             "assets/ef5aaf4cfaf9f16155eb5ee1cd41d106619e0101e5cda928c3643511b0087258.png"             "assets/princes-street-gardens/20160602_142956.jpg"             "assets/princes-street-gardens/20160602_143215.jpg"             "assets/princes-street-gardens/20180626_152029.jpg"
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Strip private metadata from large images"
            git push origin HEAD:metadata-audit-20260927
          fi
