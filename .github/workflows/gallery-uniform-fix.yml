name: Apply walked gallery uniform crop
on:
  push:
    paths:
      - '.github/workflows/gallery-uniform-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gallery presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/tour-map.js')
          s=p.read_text()
          old="'#walked .photo-card{aspect-ratio:4/3!important;background:#f3f1eb!important}#walked .photo-card img{object-fit:contain!important;background:#f3f1eb}@media(max-width:619px){#walked .photo-card{flex-basis:82%!important;max-width:360px!important}}@media(min-width:620px){#walked .photo-card{flex-basis:calc((100% - 32px)/3)!important;max-width:none!important}}'"
          new="'#walked .photo-card{aspect-ratio:4/3!important;background:#f3f1eb!important;overflow:hidden!important}#walked .photo-card img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center center!important;background:#f3f1eb}#walked .photo-card:nth-child(2) img,#walked .photo-card:nth-child(4) img,#walked .photo-card:nth-child(6) img,#walked .photo-card:nth-child(9) img,#walked .photo-card:nth-child(12) img,#walked .photo-card:nth-child(14) img{object-position:center 38%!important}#walked .walked-consent{margin:12px 0 0;font-size:.82rem;line-height:1.35;color:#68756e;white-space:nowrap}@media(max-width:420px){#walked .walked-consent{font-size:.76rem;letter-spacing:-.02em}}@media(max-width:619px){#walked .photo-card{flex-basis:82%!important;max-width:360px!important}}@media(min-width:620px){#walked .photo-card{flex-basis:calc((100% - 32px)/3)!important;max-width:none!important}}'"
          if old not in s:
              raise SystemExit('gallery style target not found')
          s=s.replace(old,new,1)
          target="  const lb=document.getElementById('lightbox');"
          inject="  let note=document.querySelector('#walked .walked-consent');\n  if(!note){note=document.createElement('p');note.className='walked-consent';note.textContent='사진은 모두 공개 동의를 받아 사용합니다.';gallery.closest('.gallery-shell')?.after(note)}else{note.textContent='사진은 모두 공개 동의를 받아 사용합니다.'}\n  const lb=document.getElementById('lightbox');"
          if target not in s:
              raise SystemExit('gallery note insertion target not found')
          s=s.replace(target,inject,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/tour-map.js
          git commit -m "Uniform walked gallery cards and shorten consent note" || exit 0
          git push
