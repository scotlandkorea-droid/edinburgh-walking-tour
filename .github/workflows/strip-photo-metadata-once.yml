name: One-time lossless JPEG metadata clean

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strip-photo-metadata-once.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow for pixel verification
        run: python3 -m pip install --quiet --target /tmp/ew-photo-strip 'Pillow>=10,<13'
      - name: Remove metadata only after verifying photo pixels
        env:
          PYTHONPATH: /tmp/ew-photo-strip
        run: python3 scripts/strip-photo-metadata-once.py
      - name: Commit only changed photo bytes
        run: |
          git add -- assets/heart-of-midlothian.jpg assets/princes-street-gardens/20160602_143215.jpg assets/princes-street-gardens/20180626_152029.jpg assets/robert-fergusson-writers-museum-paving.jpg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove EXIF/XMP losslessly from four photos"
            git push
          fi
