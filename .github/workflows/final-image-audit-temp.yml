name: Temporary final image privacy audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-image-audit-temp.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install ExifTool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libimage-exiftool-perl >/dev/null
      - name: Audit all site images
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -not -path './.git/*' -print0 | sort -z)
          echo "IMAGE_COUNT=${#files[@]}"
          bad=0
          for f in "${files[@]}"; do
            out=$(exiftool -G1 -a -s               -GPSLatitude -GPSLongitude -GPSPosition               -Make -Model -Software               -DateTimeOriginal -CreateDate -ModifyDate               -CameraOwnerName -BodySerialNumber -LensSerialNumber               -Artist -Copyright               -XMP:all -IPTC:all "$f" 2>/dev/null || true)
            if [ -n "$out" ]; then
              echo "::group::SENSITIVE_OR_EXTRA_METADATA $f"
              echo "$out"
              echo "::endgroup::"
              bad=$((bad+1))
            fi
          done
          python - <<'PY'
          from pathlib import Path
          import struct, sys
          bad=[]
          for p in Path('.').rglob('*.png'):
              if '.git' in p.parts: continue
              b=p.read_bytes()
              if not b.startswith(b'\x89PNG\r\n\x1a\n'): continue
              i=8
              chunks=[]
              while i+12 <= len(b):
                  n=struct.unpack('>I',b[i:i+4])[0]
                  typ=b[i+4:i+8]
                  if typ in (b'caBX', b'eXIf', b'iTXt', b'tEXt', b'zTXt'):
                      chunks.append(typ.decode('latin1'))
                  i += 12+n
                  if typ == b'IEND': break
              if chunks:
                  print("PNG_METADATA_CHUNKS", p, ",".join(chunks))
                  bad.append(str(p))
          if bad:
              sys.exit(3)
          PY
          if [ "$bad" -ne 0 ]; then
            echo "FILES_WITH_SENSITIVE_OR_EXTRA_METADATA=$bad"
            exit 2
          fi
          echo "FINAL_IMAGE_PRIVACY_AUDIT=PASS"
