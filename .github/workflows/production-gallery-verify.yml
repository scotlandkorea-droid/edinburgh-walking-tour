name: Temporary production gallery verification

on:
  push:
    branches:
      - production-gallery-verify-20260927

permissions:
  contents: write

jobs:
  verify-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify live homepage and gallery protection assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://edinburgh-walking-tour.scotlandkorea.workers.dev"
          html="$(curl -fsSL --retry 3 --retry-delay 2 "$base/")"
          css="$(curl -fsSL --retry 3 --retry-delay 2 "$base/assets/site.css?v=20260927-1")"
          js="$(curl -fsSL --retry 3 --retry-delay 2 "$base/assets/site-header.js?v=20260927-1")"
          [[ "$html" == *'site.css?v=20260927-1'* ]]
          [[ "$html" == *'site-header.js?v=20260927-1'* ]]
          [[ "$css" == *'#walked .photo-card img,#lightbox img{-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none'* ]]
          [[ "$js" == *"gallery.addEventListener('contextmenu',blockImageSave)"* ]]
          [[ "$js" == *"lightbox.addEventListener('contextmenu',blockImageSave)"* ]]
          [[ "$js" == *"gallery.addEventListener('dragstart',blockImageSave)"* ]]
          [[ "$js" == *"photo.draggable=false"* ]]
          echo "LIVE_GALLERY_PROTECTION=PASS"

      - name: Remove temporary verification workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/production-gallery-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary production gallery verification workflow"
            git push origin HEAD:production-gallery-verify-20260927
          fi
