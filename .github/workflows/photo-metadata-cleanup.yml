name: Temporary photo metadata cleanup

on:
  push:
    branches:
      - photo-metadata-cleanup-20260927

permissions:
  contents: write

jobs:
  clean-photo-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ExifTool
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl

      - name: Remove private image metadata without recompressing pixels
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0 |
          while IFS= read -r -d '' file; do
            exiftool -overwrite_original -all= -tagsfromfile @ -Orientation -ICC_Profile "$file"
          done

      - name: Remove temporary workflow and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/photo-metadata-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Strip private metadata from site images"
          git push origin HEAD:photo-metadata-cleanup-20260927
