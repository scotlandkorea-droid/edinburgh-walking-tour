name: Temporary New College image import

on:
  push:
    paths:
      - '.github/workflows/new-college-image-import.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download final New College images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/new-college
          curl --fail --location --retry 3 -A 'Mozilla/5.0' 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXfIdYvm9maPF7ByPdTPrE2e_d1DuKEUYgWWcIcAQSLNF8Mb2lmtfJe_nHARmD80Ftt1Ydpwm2NtunLc3Z3S2v1sM04qHZZuWFfTwmmxT0QoOWNBDExT0oQ2-Ep2bRmAo6SfeDVyMYHq30SnC6W-N2coGl0xlAjxWi_54CIg3d8hNbjWFG0=s2048?key=pKTUXG_XmQ4N-mWhPkdsfQ' -o assets/new-college/new-college-exterior.png
          curl --fail --location --retry 3 -A 'Mozilla/5.0' 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXd333W_6h5CoauBPZWDZ1kOcmpZHJ1MqTKOzHNukcUgx8IwCjbRlFKWuBBQvF58oqUjx8tWDgu_RcCLv9-AZIqDOA-X6ksXpMYLxffXBi2GhQDgAs32YHUe98Pd2koRFfCFgBdhd_KfwYyGnSzjmaqCQbC-QKMNYKOvFCmA34cCu4pz=s2048?key=pKTUXG_XmQ4N-mWhPkdsfQ' -o assets/new-college/new-college-courtyard.png
          curl --fail --location --retry 3 -A 'Mozilla/5.0' 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXfPsjh6STFtOhsHD39TiglAhDmM8HHZanufgl31klZg3sp6c6YT5ZVw_Zhouow3LT_jOaGyJBkts7WNEvLIqy23c8u93xwgV6Eo2uHQkKnCug-QIH0RzOxm5zIyRXKfF250lbUF_KQXVFCs1kbYYer7S0yJa_zeNzJ6xppGi-ShHpKW4ag=s2048?key=pKTUXG_XmQ4N-mWhPkdsfQ' -o assets/new-college/john-knox-statue-final.png
          curl --fail --location --retry 3 -A 'Mozilla/5.0' 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXflwWSwp1z-I8l_ixcMsYHAV9UCq0wtkCtVmef5gF_D0YtTPINeOd-mQA1A5kAr7m5RrdPNlxcL5XwOxyzH9JcGac_mJ8AHb3NBQzJB7YFr-aqqoIfmn5yUeMZE_AfX_JbOcBgzsp6pxribnJjyGVcaH6D7QvxIJUxBFit1WJsR7awx=s2048?key=pKTUXG_XmQ4N-mWhPkdsfQ' -o assets/new-college/new-college-view.png
          test -s assets/new-college/new-college-exterior.png
          test -s assets/new-college/new-college-courtyard.png
          test -s assets/new-college/john-knox-statue-final.png
          test -s assets/new-college/new-college-view.png
          file assets/new-college/*.png
      - name: Commit images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/new-college/new-college-exterior.png assets/new-college/new-college-courtyard.png assets/new-college/john-knox-statue-final.png assets/new-college/new-college-view.png
          git commit -m 'Add final New College images'
          git push origin HEAD:main
