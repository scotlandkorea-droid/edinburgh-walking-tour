name: Verify published browser interactions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-public-browser.py'
      - '.github/workflows/verify-public-browser.yml'

permissions:
  contents: read

jobs:
  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install lightweight browser controller
        run: python3 -m pip install --quiet --target /tmp/ew-browser-python 'playwright>=1.54,<1.60'
      - name: Install Korean text shaping fonts for visual screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Test published home at mobile, tablet and desktop sizes
        env:
          PYTHONPATH: /tmp/ew-browser-python
        run: python3 scripts/verify-public-browser.py
      - name: Preserve read-only results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-interactions
          path: /tmp/ew-browser-qa/
          retention-days: 7
