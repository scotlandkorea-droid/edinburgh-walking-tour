name: Build internal search index

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'places/**/*.html'
      - 'edinburgh/**/*.html'
      - 'scotland/**/*.html'
      - 'st-andrews/**/*.html'
      - 'travel/**/*.html'
      - 'assets/navigation-data.js'
      - 'assets/navigation-system.js'
      - 'assets/site-header.js'
      - 'assets/tour-course-data.js'
      - 'assets/tour-map.js'
      - 'assets/site.css'
      - 'sitemap.xml'
      - '.assetsignore'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'scripts/build-search-index.mjs'
      - 'scripts/sync-sitemap-lastmod.mjs'
      - 'scripts/audit-site.mjs'
      - 'scripts/audit-publication-quality.mjs'
      - 'scripts/complete-social-metadata.mjs'
      - 'scripts/check-public-deployment.mjs'
      - 'scripts/set-image-dimensions.mjs'
      - 'scripts/audit-accessibility.mjs'
      - 'scripts/report-css-inventory.mjs'
      - 'scripts/audit-search-behavior.mjs'
      - 'scripts/audit-image-privacy.mjs'
      - 'assets/**/*.jpg'
      - 'assets/**/*.jpeg'
      - 'assets/**/*.png'
      - 'assets/**/*.webp'
      - 'images/**/*.jpg'
      - 'images/**/*.jpeg'
      - 'images/**/*.png'
      - 'images/**/*.webp'
      - 'scripts/search-curation.json'
      - '.github/workflows/build-search-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site-search-main
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/site-header.js
          node --check assets/navigation-system.js
          node --check assets/navigation-data.js
          node --check assets/tour-course-data.js
          node --check assets/tour-map.js
          node --check assets/search-data.js
          node --input-type=module --check < worker.js
          node --check scripts/build-search-index.mjs
          node --check scripts/sync-sitemap-lastmod.mjs
          node --check scripts/audit-site.mjs
          node --check scripts/audit-publication-quality.mjs
          node --check scripts/complete-social-metadata.mjs
          node --check scripts/check-public-deployment.mjs
          node --check scripts/set-image-dimensions.mjs
          node --check scripts/audit-accessibility.mjs
          node --check scripts/report-css-inventory.mjs
          node --check scripts/audit-search-behavior.mjs
          node --check scripts/audit-image-privacy.mjs
      - name: Set missing intrinsic image sizes without changing photos
        run: node scripts/set-image-dimensions.mjs --write
      - name: Complete missing social metadata without editing article bodies
        run: node scripts/complete-social-metadata.mjs --write
      - name: Generate static search index
        run: node scripts/build-search-index.mjs
      - name: Check generated index is reproducible
        run: node scripts/build-search-index.mjs --check
      - name: Update sitemap dates using meaningful page history
        run: node scripts/sync-sitemap-lastmod.mjs
      - name: Verify sitemap dates are reproducible
        run: node scripts/sync-sitemap-lastmod.mjs --check
      - name: Audit static site links and metadata
        run: node scripts/audit-site.mjs
      - name: Report publication metadata and prevent misleading business schema
        run: node scripts/audit-publication-quality.mjs
      - name: Report accessibility consistency of HTML pages
        run: node scripts/audit-accessibility.mjs
      - name: Verify internal search ranking and aliases
        run: node scripts/audit-search-behavior.mjs
      - name: Inspect image metadata without changing photographs
        run: node scripts/audit-image-privacy.mjs
      - name: Report CSS cleanup candidates without removing rules
        run: node scripts/report-css-inventory.mjs
      - name: Check public Workers deployment without treating lag as CI failure
        run: node scripts/check-public-deployment.mjs
      - name: Commit search index and metadata only when they differ
        run: |
          git add assets/search-data.js
          git add sitemap.xml
          git add -u -- '*.html'
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Maintain site search index, metadata and accurate sitemap dates"
            # Other approved commits can land while these slow audits run.
            # Rebase the bot's generated metadata commit instead of forcing
            # older branch contents over new pages or user photographs.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "Could not push generated metadata after three safe attempts" >&2
            exit 1
          fi
