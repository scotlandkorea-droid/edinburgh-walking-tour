name: Import current Netlify site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-current-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download current live site
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fanciful-naiad-e1081c.netlify.app'
          paths=(
            'index.html'
            'robots.txt'
            'assets/arthurs-seat.jpg'
            'assets/calton-hill.jpg'
            'assets/edinburgh-panorama.jpg'
            'assets/floral-clock.jpg'
            'assets/greyfriars-bobby.jpg'
            'assets/john-knox-st-giles.jpg'
            'assets/patrick-hamilton-ph.jpg'
            'assets/royal-mile.jpg'
            'assets/tour-castle.jpg'
            'assets/tour-scott-monument.jpg'
            'places/arthurs-seat.html'
            'places/calton-hill.html'
            'places/canongate.html'
            'places/conan-doyle.html'
            'places/david-hume.html'
            'places/edinburgh-castle.html'
            'places/elephant-house.html'
            'places/grassmarket.html'
            'places/greyfriars-alexander-henderson.html'
            'places/greyfriars-bobby-story.html'
            'places/greyfriars-bobby.html'
            'places/greyfriars-covenanter-martyrs.html'
            'places/greyfriars-flodden-wall.html'
            'places/greyfriars-harry-potter.html'
            'places/greyfriars-kirk.html'
            'places/greyfriars-old-cemetery.html'
            'places/greyfriars.html'
            'places/holyrood-palace.html'
            'places/john-knox-grave.html'
            'places/john-knox-house.html'
            'places/national-gallery.html'
            'places/national-library.html'
            'places/national-museum.html'
            'places/new-college.html'
            'places/new-town.html'
            'places/princes-street.html'
            'places/royal-mile.html'
            'places/scott-monument.html'
            'places/scottish-parliament.html'
            'places/st-giles.html'
            'places/university-of-edinburgh.html'
            'places/writers-museum.html'
            'travel/accommodation.html'
            'travel/airport-transport.html'
            'travel/food-drink.html'
            'travel/hiking.html'
            'travel/how-to-travel.html'
            'travel/itineraries.html'
            'travel/shopping.html'
            'travel/st-andrews.html'
            'travel/when-to-go.html'
            'travel/where-to-go.html'
          )
          for p in "${paths[@]}"; do
            mkdir -p "$(dirname "$p")"
            curl --fail --location --retry 3 --silent --show-error "$BASE/$p" -o "$p"
          done

      - name: Commit imported site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html robots.txt assets places travel
          if git diff --cached --quiet; then
            echo 'No site changes to commit.'
          else
            git commit -m 'Import current Netlify site'
            git push
          fi
