name: One-time JPEG extension cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-mislabeled-jpegs-once.yml'
      - 'scripts/rename-mislabeled-jpegs-once.py'

permissions:
  contents: write

jobs:
  rename-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rename JPEGs without re-encoding and update site references
        run: python3 scripts/rename-mislabeled-jpegs-once.py
      - name: Verify Worker syntax and all static links
        run: |
          node --input-type=module --check < worker.js
          node scripts/audit-site.mjs
      - name: Verify image dimensions and image formats
        run: |
          python3 -m pip install --quiet --target /tmp/ew-photo-qa 'Pillow>=10,<13'
          PYTHONPATH=/tmp/ew-photo-qa python3 scripts/audit-image-quality.py
      - name: Commit atomic image cleanup
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Correct four JPEG extensions without recompression and preserve legacy URLs"
          git push
