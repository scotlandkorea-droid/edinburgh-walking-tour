name: Apply V11 final integrated updates
on:
  push:
    paths:
      - '.github/workflows/apply-v11-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final integrated changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html'); s=p.read_text()
          old='<div class="route-stop end"><span class="route-node"></span><a class="route-card" href="/places/calton-hill.html">칼튼 힐</a><span class="route-loop" aria-hidden="true">↗</span></div>'
          new='<div class="route-stop"><span class="route-node"></span><a class="route-card" href="/places/calton-hill.html">칼튼 힐</a><span class="route-direction" aria-hidden="true">→</span></div><div class="route-stop end"><span class="end-flag">END</span><span class="route-node"></span><a class="route-card" href="/places/waverley-station.html">에든버러 웨이벌리역</a></div>'
          if old in s: s=s.replace(old,new)
          # Explore gate icons: restrained inline SVG, no emoji.
          gates=[('장소로 보기','<span class="explore-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></svg></span>'),('테마로 보기','<span class="explore-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H12v18H7.5A3.5 3.5 0 0 0 4 23Zm16 0A3.5 3.5 0 0 0 16.5 2H12v18h4.5A3.5 3.5 0 0 1 20 23Z"/></svg></span>'),('인물로 보기','<span class="explore-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21c.8-4.5 3.1-6.8 7-6.8s6.2 2.3 7 6.8"/></svg></span>')]
          for label,icon in gates:
              s=s.replace(f'<strong>{label}</strong>',icon+f'<strong>{label}</strong>')
          p.write_text(s)

          p=Path('assets/site.css'); s=p.read_text()
          s += '''\n/* V11 2026-09-14 final integrated refinements */
          .route-stop.start .route-node{display:none}.route-stop.start{padding-top:29px}.start-flag{left:8px;top:3px;transform:translateY(-100%);white-space:nowrap}.end-flag{position:absolute;left:8px;top:3px;transform:translateY(-100%);padding:4px 8px;border-radius:6px;background:var(--plum-strong);color:#fff;font-size:10px;font-weight:850;letter-spacing:.06em;z-index:3}.route-stop.end .route-node{border-color:var(--plum-strong)}
          .explore-gate{min-height:124px;padding:18px 43px 18px 20px}.explore-gate strong{font-size:22px;margin-bottom:6px}.explore-icon{width:25px;height:25px;display:grid;place-items:center;color:#405449;margin-bottom:8px}.explore-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
          #explore{padding-top:62px;padding-bottom:62px}#explore .section-head{margin-bottom:23px}
          .contact-heading{position:relative;padding-left:0!important;border-left:0!important}.contact-heading:before{content:"";position:absolute;left:-16px;top:2px;bottom:2px;width:3px;border-radius:3px;background:#82998b}.contact-heading h2{font-size:clamp(30px,6.5vw,46px)!important;line-height:1.14!important;font-weight:830!important}.contact-heading p{line-height:1.65!important}
          @media(max-width:719px){#explore{padding-top:56px;padding-bottom:56px}.explore-gate{min-height:112px;padding-top:16px;padding-bottom:16px}.contact-heading:before{left:-14px}}
          @media(prefers-reduced-motion:reduce){.explore-gate,.route-card{transition:none!important}}
          '''
          p.write_text(s)

          p=Path('assets/tour-map.js'); s=p.read_text()
          s=s.replace("  {n:'칼튼 힐',u:'/places/calton-hill.html',lat:55.95474,lng:-3.18191}\n];","  {n:'칼튼 힐',u:'/places/calton-hill.html',lat:55.95474,lng:-3.18191},\n  {n:'에든버러 웨이벌리역',u:'/places/waverley-station.html',lat:55.95200,lng:-3.18900,end:true}\n];")
          # Replace representative path with a more compact tour-flow geometry; route-only points remain non-place markers.
          a=s.index('const path=['); b=s.index('];',a)+2
          path="""const path=[
            [55.95236,-3.19326],[55.95141,-3.19361],[55.95045,-3.19720],[55.95015,-3.20420],[55.95055,-3.19930],[55.95083,-3.19577],
            [55.95300,-3.19610],[55.95120,-3.19560],[55.94972,-3.19528],[55.94868,-3.20041],[55.94757,-3.19600],[55.94700,-3.19272],[55.94692,-3.19130],[55.94694,-3.18889],
            [55.94765,-3.19120],[55.94865,-3.19407],[55.94956,-3.19263],[55.94944,-3.19083],[55.95056,-3.18556],[55.95067,-3.18510],[55.95158,-3.17899],[55.95189,-3.17502],[55.95270,-3.17229],[55.95474,-3.18191],[55.95320,-3.18490],[55.95200,-3.18900]
          ];"""
          s=s[:a]+path+s[b:]
          s=s.replace('에든버러 워킹투어 18개 장소의 대표 동선 미리보기','에든버러 워킹투어 19개 장소의 대표 동선 미리보기')
          s=s.replace("const dots=stops.map((s,i)=>{const [x,y]=project([s.lat,s.lng]);return `<circle cx=\"${x.toFixed(1)}\" cy=\"${y.toFixed(1)}\" r=\"${i===0?6:4.3}\" class=\"${i===0?'start-dot':'stop-dot'}\"><title>${s.n}</title></circle>`}).join('');","const dots=stops.slice(1).map((s,i)=>{const [x,y]=project([s.lat,s.lng]);return `<circle cx=\"${x.toFixed(1)}\" cy=\"${y.toFixed(1)}\" r=\"4.3\" class=\"stop-dot\"><title>${s.n}</title></circle>`}).join('');")
          s=s.replace("<text class=\"preview-label\" x=\"50\" y=\"207\">Edinburgh · walking route preview</text>","<text class=\"preview-label\" x=\"50\" y=\"207\">에든버러 워킹투어 코스</text>")
          # Add END to preview.
          s=s.replace("${dots}<g class=\"preview-start\"", "${dots}<g class=\"preview-end\" transform=\"translate(${(project([stops[stops.length-1].lat,stops[stops.length-1].lng])[0]-12).toFixed(1)} ${(project([stops[stops.length-1].lat,stops[stops.length-1].lng])[1]-15).toFixed(1)})\"><text x=\"0\" y=\"0\">END</text></g><g class=\"preview-start\"")
          # Start marker is flag only; end marker has END label.
          s=s.replace("html:i===0?'<span class=\"route-map-marker start\">⚑</span>':'<span class=\"route-map-marker\"></span>'","html:i===0?'<span class=\"route-map-marker start\">⚑ START</span>':(i===stops.length-1?'<span class=\"route-map-marker end\">END</span>':'<span class=\"route-map-marker\"></span>')")
          p.write_text(s)

          p=Path('assets/detail-tools.js'); s=p.read_text()
          s=s.replace("['calton-hill','칼튼 힐']]","['calton-hill','칼튼 힐'],['waverley-station','에든버러 웨이벌리역']]")
          p.write_text(s)

          # Create Waverley detail as a noindex content shell until user's full article is supplied.
          wp=Path('places/waverley-station.html')
          if not wp.exists():
              wp.write_text('''<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에든버러 웨이벌리역 | 에든버러 워킹투어</title><meta name="description" content="에든버러 워킹투어의 마지막 지점인 에든버러 웨이벌리역 안내 페이지입니다."><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="/assets/site.css"><script defer src="/assets/detail-tools.js"></script></head><body><header class="site-header"><div class="wrap topbar"><a class="brand" href="/"><span class="mark">EW</span><span>에든버러 워킹투어</span></a></div></header><main><section class="page-hero"><div class="wrap"><div class="breadcrumbs"><a href="/">홈</a> › <a href="/#tour">워킹투어 코스</a> › 에든버러 웨이벌리역</div><h1>에든버러 웨이벌리역</h1><p>에든버러 워킹투어의 마지막 지점입니다.</p></div></section><article class="wrap"><section class="placeholder-section"><h2>에든버러 웨이벌리역 이야기</h2><p>이 페이지의 상세 원고는 별도 완성 원고가 확정되는 대로 보강합니다.</p></section></article></main></body></html>''')

          # Intermediate hubs: remove redundant home-return text, normalize global header when a custom nav is present.
          global_nav='<nav class="nav"><a href="/edinburgh/tour-guide.html">투어 안내</a><a href="/#tour">투어 코스</a><a href="/#explore">장소 · 테마 · 인물</a><a href="/#walked">함께한 분들</a><a href="/#guide">안내자 소개</a><a href="/#travel">여행 정보</a><a href="/#contact">문의</a></nav>'
          for fn in ['edinburgh/places.html','edinburgh/themes.html','edinburgh/people.html','scotland/index.html']:
              q=Path(fn)
              if not q.exists(): continue
              t=q.read_text()
              t=re.sub(r'<a[^>]*>\s*(?:←\s*)?홈(?:으로 돌아가기)?\s*</a>','',t)
              if '<nav class="nav">' in t:
                  t=re.sub(r'<nav class="nav">.*?</nav>',global_nav,t,count=1,flags=re.S)
              q.write_text(t)

          # Broken theme links: do not leave 404 targets; render as non-link cards until real content exists.
          q=Path('edinburgh/themes.html')
          if q.exists():
              t=q.read_text()
              for slug in ['history-city','architecture-cityscape','scottish-culture-life']:
                  t=re.sub(rf'<a([^>]*?)href="/edinburgh/themes/{slug}\.html"([^>]*)>(.*?)</a>',r'<div\1\2>\3</div>',t,flags=re.S)
              q.write_text(t)

          # Ensure detail scripts are present on all real HTML detail pages; keep skeleton/noindex policy.
          for q in list(Path('places').glob('*.html'))+list(Path('travel').glob('*.html'))+list(Path('edinburgh/people').glob('*.html'))+list(Path('edinburgh/themes').glob('*.html')):
              t=q.read_text()
              if 'detail-tools.js' not in t and '</head>' in t:
                  t=t.replace('</head>','<script defer src="/assets/detail-tools.js"></script></head>')
                  q.write_text(t)
          PY
      - name: Validate key requirements
        run: |
          grep -q '에든버러 웨이벌리역' index.html
          grep -q "waverley-station" assets/tour-map.js
          grep -q "waverley-station" assets/detail-tools.js
          grep -q '여행에 궁금한 점이 있으시면 문의해 주세요.' index.html
          test -f places/waverley-station.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply final integrated V11 website updates' || exit 0
          git push
