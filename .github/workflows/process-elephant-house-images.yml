name: Process Elephant House images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/process-elephant-house-images.yml"

permissions:
  contents: write

jobs:
  process-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build optimized images and update page
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps

          sources = [
              ("dfd01d36d8d6c2a216d473d0cc14ca7ff33deca2", Path("/tmp/elephant-house-exterior.jpg"), Path("assets/elephant-house-exterior.webp")),
              ("4182d06f65adf312c000a17a9345f88a13147de4", Path("/tmp/elephant-house-birthplace-sign.jpg"), Path("assets/elephant-house-birthplace-sign.webp")),
          ]

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]

          def fetch_blob(sha, dest):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
              dest.write_bytes(base64.b64decode(data["content"]))

          for sha, src, dst in sources:
              fetch_blob(sha, src)
              im = ImageOps.exif_transpose(Image.open(src)).convert("RGB")
              max_dim = 1400
              scale = min(1.0, max_dim / max(im.size))
              if scale < 1.0:
                  im = im.resize((round(im.width * scale), round(im.height * scale)), Image.Resampling.LANCZOS)
              dst.parent.mkdir(parents=True, exist_ok=True)
              im.save(dst, "WEBP", quality=82, method=6)

          page_path = Path("places/elephant-house.html")
          page = page_path.read_text(encoding="utf-8")

          page = page.replace(
              "https://edinburgh-walking-tour.scotlandkorea.workers.dev/assets/edinburgh-panorama.jpg",
              "https://edinburgh-walking-tour.scotlandkorea.workers.dev/assets/elephant-house-exterior.webp",
          )

          if "/assets/elephant-house-exterior.webp" not in page:
              anchor = "<p>전 세계에서 이 카페를 찾아오는 사람들도 대부분 그렇게 생각합니다.</p>"
              figure = anchor + '\n<figure class="story-photo"><img src="/assets/elephant-house-exterior.webp" alt="조지 4세 브리지의 엘리펀트 하우스" width="1050" height="1400" loading="lazy" decoding="async"><figcaption>조지 4세 브리지의 엘리펀트 하우스.</figcaption></figure>'
              page = page.replace(anchor, figure, 1)

          if "/assets/elephant-house-birthplace-sign.webp" not in page:
              anchor = "<p>엄밀히 말하면 탄생지가 아닙니다. 그런데 세계에서 가장 유명한 ‘해리 포터 탄생지’가 됐습니다.</p>"
              figure = anchor + '\n<figure class="story-photo"><img src="/assets/elephant-house-birthplace-sign.webp" alt="엘리펀트 하우스의 birthplace of Harry Potter 간판" width="873" height="1400" loading="lazy" decoding="async"><figcaption>엘리펀트 하우스 창에 걸린 ‘birthplace of Harry Potter’ 문구.</figcaption></figure>'
              page = page.replace(anchor, figure, 1)

          page = page.replace("/assets/site-header.js?v=20260930-9", "/assets/site-header.js?v=20260930-10")
          page_path.write_text(page, encoding="utf-8")
          PY

      - name: Commit website changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/elephant-house-exterior.webp assets/elephant-house-birthplace-sign.webp places/elephant-house.html
          git commit -m "Add Elephant House photos"
          git push
