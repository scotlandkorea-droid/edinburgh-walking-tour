name: Prepare optimized hero delivery copies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-hero-images.py'
      - '.github/workflows/prepare-hero-images.yml'
      - 'assets/ab75b4d57bc76a4b8ce8d532e05cf08119800cc3381112669064a9110390bfc7 (1).png'
      - 'assets/ef5aaf4cfaf9f16155eb5ee1cd41d106619e0101e5cda928c3643511b0087258.png'

permissions:
  contents: write

concurrency:
  group: hero-image-delivery-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Install image codec (temporary CI only)
        run: python3 -m pip install --quiet --target /tmp/ew-photo-codec 'Pillow>=10,<13'
      - name: Encode delivery images without modifying source photos
        env:
          PYTHONPATH: /tmp/ew-photo-codec
        run: python3 scripts/prepare-hero-images.py
      - name: Preserve side-by-side photographic comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-versus-optimized-hero
          path: /tmp/ew-hero-preview/
          retention-days: 7
      - name: Commit reproducible delivery copies when different
        run: |
          git add assets/hero-mobile-optimized.webp assets/hero-desktop-optimized.webp
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add optimized WebP delivery copies of unchanged homepage Hero photos"
            git push
          fi
