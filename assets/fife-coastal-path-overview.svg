<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 625" width="1120" height="625" role="img" aria-labelledby="maptitle mapdesc">
<title id="maptitle">파이프 코스탈 패스 전체 진행 방향 개략도</title>
<desc id="mapdesc">남서쪽 킨카딘에서 시작해 컬로스, 노스 퀸스페리, 달게티 베이, 애버두어, 번티슬랜드, 커콜디, 레번, 엘리, 안스트루더, 크레일, 세인트앤드루스, 테이포트를 지나 뉴버그까지 이어지는 방향을 표시한 개략도입니다. 정확한 보행 경로나 지형 축척과 일치하지 않습니다.</desc>
