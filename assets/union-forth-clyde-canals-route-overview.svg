<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540" role="img" aria-labelledby="title desc"><title id="title">운하를 따라 걷는 길 주요 경유지 위치 개략도</title><desc id="desc">지리적 위치에 맞춰 주요 마을을 배치하고 순서를 직선으로 이은 개략도. 실제 보행 경로나 길 찾기 지도가 아닙니다.</desc><rect width="840" height="540" rx="24" fill="#f5f9f8"/><rect x="20" y="20" width="800" height="500" rx="18" fill="#fff" stroke="#dce9e5"/><text x="44" y="61" font-size="27" font-weight="750" fill="#173b42">운하를 따라 걷는 길</text><text x="44" y="88" font-size="15" fill="#53717a">주요 경유지의 상대 위치 · 북쪽 ↑ · 자체 제작 위치 개략도</text><path d="M44 110 H796" stroke="#e5efec"/><polyline points="710.0,273.9 477.9,250.7 432.6,241.6 342.1,226.4 166.6,287.1 110.0,337.6" fill="none" stroke="#177d86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9"/><circle cx="710.0" cy="273.9" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="698.0" y="256.9" text-anchor="end" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">에든버러</text><circle cx="477.9" cy="250.7" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="489.9" y="272.7" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">린리스고</text><circle cx="432.6" cy="241.6" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="444.6" y="224.6" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">에이번 수로교</text><circle cx="342.1" cy="226.4" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="354.1" y="248.4" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">폴커크 휠</text><circle cx="166.6" cy="287.1" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="178.6" y="270.1" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">커킨틸로크</text><circle cx="110.0" cy="337.6" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="122.0" y="359.6" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">글래스고</text><rect x="42" y="468" width="756" height="33" rx="7" fill="#edf5f3"/><text x="54" y="489" font-size="14" fill="#315960">점선은 경유지 순서만 표시합니다. 실제 산길·운하 둑길은 공식 지도를 확인하세요.</text></svg>