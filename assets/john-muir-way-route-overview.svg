<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540" role="img" aria-labelledby="title desc"><title id="title">존 뮤어 웨이 주요 경유지 위치 개략도</title><desc id="desc">지리적 위치에 맞춰 주요 마을을 배치하고 순서를 직선으로 이은 개략도. 실제 보행 경로나 길 찾기 지도가 아닙니다.</desc><rect width="840" height="540" rx="24" fill="#f5f9f8"/><rect x="20" y="20" width="800" height="500" rx="18" fill="#fff" stroke="#dce9e5"/><text x="44" y="61" font-size="27" font-weight="750" fill="#173b42">존 뮤어 웨이</text><text x="44" y="88" font-size="15" fill="#53717a">주요 경유지의 상대 위치 · 북쪽 ↑ · 자체 제작 위치 개략도</text><path d="M44 110 H796" stroke="#e5efec"/><polyline points="110.0,282.0 147.8,282.0 266.8,311.0 366.8,282.0 415.4,291.7 469.5,286.8 526.2,306.2 653.2,253.0 710.0,282.0" fill="none" stroke="#177d86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9"/><circle cx="110.0" cy="282.0" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="122.0" y="265.0" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">헬렌즈버러</text><circle cx="147.8" cy="282.0" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="159.8" y="304.0" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">발로크</text><circle cx="266.8" cy="311.0" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="278.8" y="294.0" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">커킨틸로크</text><circle cx="366.8" cy="282.0" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="378.8" y="304.0" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">폴커크</text><circle cx="415.4" cy="291.7" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="427.4" y="274.7" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">린리스고</text><circle cx="469.5" cy="286.8" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="481.5" y="308.8" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">사우스 퀸스페리</text><circle cx="526.2" cy="306.2" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="538.2" y="289.2" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">에든버러</text><circle cx="653.2" cy="253.0" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="641.2" y="275.0" text-anchor="end" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">노스 버윅</text><circle cx="710.0" cy="282.0" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="698.0" y="265.0" text-anchor="end" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">던바</text><rect x="42" y="468" width="756" height="33" rx="7" fill="#edf5f3"/><text x="54" y="489" font-size="14" fill="#315960">점선은 경유지 순서만 표시합니다. 실제 산길·운하 둑길은 공식 지도를 확인하세요.</text></svg>