<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540" role="img" aria-labelledby="title desc"><title id="title">롭 로이 웨이 주요 경유지 위치 개략도</title><desc id="desc">지리적 위치에 맞춰 주요 마을을 배치하고 순서를 직선으로 이은 개략도. 실제 보행 경로나 길 찾기 지도가 아닙니다.</desc><rect width="840" height="540" rx="24" fill="#f5f9f8"/><rect x="20" y="20" width="800" height="500" rx="18" fill="#fff" stroke="#dce9e5"/><text x="44" y="61" font-size="27" font-weight="750" fill="#173b42">롭 로이 웨이</text><text x="44" y="88" font-size="15" fill="#53717a">주요 경유지의 상대 위치 · 북쪽 ↑ · 자체 제작 위치 개략도</text><path d="M44 110 H796" stroke="#e5efec"/><polyline points="310.4,439.5 329.7,384.5 374.0,354.5 346.3,314.5 346.3,239.5 470.9,164.5 509.6,124.5" fill="none" stroke="#177d86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9"/><circle cx="310.4" cy="439.5" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="322.4" y="422.5" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">드라이먼</text><circle cx="329.7" cy="384.5" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="341.7" y="406.5" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">애버포일</text><circle cx="374.0" cy="354.5" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="386.0" y="337.5" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">캘런더</text><circle cx="346.3" cy="314.5" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="358.3" y="336.5" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">스트라사이어</text><circle cx="346.3" cy="239.5" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="358.3" y="222.5" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">킬린</text><circle cx="470.9" cy="164.5" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="482.9" y="186.5" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">애버펠디</text><circle cx="509.6" cy="124.5" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="521.6" y="107.5" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">피틀로크리</text><rect x="42" y="468" width="756" height="33" rx="7" fill="#edf5f3"/><text x="54" y="489" font-size="14" fill="#315960">점선은 경유지 순서만 표시합니다. 실제 산길·운하 둑길은 공식 지도를 확인하세요.</text></svg>