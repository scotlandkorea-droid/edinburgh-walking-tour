<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540" role="img" aria-labelledby="title desc"><title id="title">세인트 커스버트 웨이 주요 경유지 위치 개략도</title><desc id="desc">지리적 위치에 맞춰 주요 마을을 배치하고 순서를 직선으로 이은 개략도. 실제 보행 경로나 길 찾기 지도가 아닙니다.</desc><rect width="840" height="540" rx="24" fill="#f5f9f8"/><rect x="20" y="20" width="800" height="500" rx="18" fill="#fff" stroke="#dce9e5"/><text x="44" y="61" font-size="27" font-weight="750" fill="#173b42">세인트 커스버트 웨이</text><text x="44" y="88" font-size="15" fill="#53717a">주요 경유지의 상대 위치 · 북쪽 ↑ · 자체 제작 위치 개략도</text><path d="M44 110 H796" stroke="#e5efec"/><polyline points="110.0,293.5 162.2,328.2 397.0,351.3 566.5,351.3 625.2,224.3 710.0,212.7" fill="none" stroke="#177d86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9"/><circle cx="110.0" cy="293.5" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="122.0" y="276.5" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">멜로즈</text><circle cx="162.2" cy="328.2" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="174.2" y="350.2" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">세인트 보스웰스</text><circle cx="397.0" cy="351.3" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="409.0" y="334.3" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">커크 예솔름</text><circle cx="566.5" cy="351.3" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="578.5" y="373.3" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">울러</text><circle cx="625.2" cy="224.3" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="613.2" y="207.3" text-anchor="end" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">펜윅</text><circle cx="710.0" cy="212.7" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="698.0" y="234.7" text-anchor="end" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">홀리 아일랜드</text><rect x="42" y="468" width="756" height="33" rx="7" fill="#edf5f3"/><text x="54" y="489" font-size="14" fill="#315960">점선은 경유지 순서만 표시합니다. 실제 산길·운하 둑길은 공식 지도를 확인하세요.</text></svg>