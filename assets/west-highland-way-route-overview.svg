<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540" role="img" aria-labelledby="title desc"><title id="title">웨스트 하이랜드 웨이 주요 경유지 위치 개략도</title><desc id="desc">지리적 위치에 맞춰 주요 마을을 배치하고 순서를 직선으로 이은 개략도. 실제 보행 경로나 길 찾기 지도가 아닙니다.</desc><rect width="840" height="540" rx="24" fill="#f5f9f8"/><rect x="20" y="20" width="800" height="500" rx="18" fill="#fff" stroke="#dce9e5"/><text x="44" y="61" font-size="27" font-weight="750" fill="#173b42">웨스트 하이랜드 웨이</text><text x="44" y="88" font-size="15" fill="#53717a">주요 경유지의 상대 위치 · 북쪽 ↑ · 자체 제작 위치 개략도</text><path d="M44 110 H796" stroke="#e5efec"/><polyline points="488.3,439.5 462.5,393.0 444.7,385.8 424.9,364.3 409.0,299.9 411.0,264.1 399.1,231.9 385.2,185.4 361.4,163.9 331.7,124.5" fill="none" stroke="#177d86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9"/><circle cx="488.3" cy="439.5" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="500.3" y="422.5" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">밀른게이비</text><circle cx="462.5" cy="393.0" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="474.5" y="415.0" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">드라이먼</text><circle cx="444.7" cy="385.8" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="456.7" y="368.8" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">발마하</text><circle cx="424.9" cy="364.3" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="436.9" y="386.3" text-anchor="start" font-size="17" font-weight="650" fill="#173b42" paint-order="stroke" stroke="#fff" stroke-width="5">로워드</text><circle cx="409.0" cy="299.9" r="6" fill="#fff" stroke="#176b72" stroke-width="3"/><text x="421.0" y="282.9" text-anchor="start" font-size="17" font-weight="650" 